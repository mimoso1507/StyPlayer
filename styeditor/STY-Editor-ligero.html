<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>STY Editor</title>
<style>
:root { --onacc: #fff;
  --bg: #111318; --panel: #1b1e26; --panel2: #232733; --line: #2f3442; --text: #e9ecf2; --mute: #9aa3b5;
  --accent: #4f8cff; --danger: #ff5b5b; --ok: #3ccf8e;
  --intro: #3ccf8e; --main: #4f8cff; --fill: #f2b544; --brk: #c77dff; --end: #ff7a59;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: 210px; }
button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer; }
button:active { transform: scale(.97); }
button.pri { background: var(--accent); border-color: var(--accent); color: var(--onacc, #fff); font-weight: 600; }
button.del { background: transparent; border-color: var(--danger); color: var(--danger); }
button.ghost { background: transparent; }
button:disabled { opacity: .4; }
header { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; padding: 12px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: .3px; }
header h1 span { color: var(--accent); }
main { padding: 12px 16px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); max-width: 1400px; margin: 0 auto; }
.empty { grid-column: 1/-1; text-align: center; color: var(--mute); padding: 48px 12px; border: 2px dashed var(--line); border-radius: 16px; }
.empty b { color: var(--text); display: block; font-size: 17px; margin-bottom: 6px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-width: 0; }
.card.dirty { border-color: #4f8cff88; }
.ctop { display: flex; gap: 8px; align-items: flex-start; }
.ctop .nm { flex: 1; min-width: 0; }
.ctop .nm b { display: block; overflow-wrap: anywhere; }
.ctop .nm small { color: var(--mute); }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--panel2); border: 1px solid var(--line); color: var(--mute); margin-right: 4px; }
.tag.mod { color: var(--accent); border-color: var(--accent); }
.x { padding: 4px 10px; }
.grp { margin-top: 10px; }
.grp h4 { margin: 0 0 6px; font-size: 12px; color: var(--mute); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; display: flex; align-items: center; gap: 6px; }
.grp h4 i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; min-width: 66px; padding: 7px 10px; border-radius: 10px; background: var(--panel2); border: 2px solid transparent; text-align: left; line-height: 1.15; }
.chip b { display: block; font-size: 15px; }
.chip small { color: var(--mute); font-size: 11px; }
.chip.sel { border-color: var(--k); background: color-mix(in srgb, var(--k) 22%, var(--panel2)); }
.chip.sel::after { content: "✓"; position: absolute; top: 3px; right: 6px; font-size: 12px; color: var(--k); font-weight: 700; }
.chip.empty0 small { color: var(--danger); }
.cfoot { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.cfoot button { flex: 1; padding: 8px 10px; font-size: 14px; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--panel) 97%, transparent); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
#bar .row { display: flex; gap: 8px; max-width: 900px; margin: 0 auto; flex-wrap: wrap; align-items: center; }
#bar .cnt { flex: 1 1 100%; font-size: 13px; color: var(--mute); display: flex; justify-content: space-between; }
#bar .cnt a { color: var(--accent); cursor: pointer; }
#bar button { flex: 1; }
#bar .play { flex: 1 1 100%; display: flex; gap: 10px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
#bar .play button { flex: 0 0 auto; min-width: 128px; }
#bar .play span { flex: 1; min-width: 0; font-size: 13px; color: var(--mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#bar .play.on button { background: var(--danger); border-color: var(--danger); }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 18px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); }
dialog::backdrop { background: rgba(0,0,0,.6); }
.dlg { padding: 16px; display: grid; gap: 12px; }
.dlg h3 { margin: 0; font-size: 17px; }
.dlg p { margin: 0; color: var(--mute); font-size: 14px; }
.dlg .acts { display: flex; gap: 8px; justify-content: flex-end; }
.dlg .acts button { min-width: 100px; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--mute); }
select, input[type=text] { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; }
.map { display: grid; gap: 8px; }
.map .r { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.map .r span { font-weight: 600; }
.map .r em { color: var(--mute); font-style: normal; }
.dests { display: grid; gap: 6px; max-height: 28vh; overflow: auto; }
.dests .dst { background: var(--panel2); border-radius: 10px; padding: 8px 10px; overflow-wrap: anywhere; }
.mh { font-size: 13px; font-weight: 600; color: var(--accent); margin-top: 4px; overflow-wrap: anywhere; }
.map { max-height: 34vh; overflow: auto; }
.dlg.wide { max-height: calc(100vh - 56px); overflow: auto; }
.edtop, .edrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.edbox { background: var(--panel2); border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
.edbox .mute, .mute { color: var(--mute); font-size: 12px; }
.edrow input[type=number], .two input { width: 90px; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.trk { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: grid; gap: 6px; }
.trk.mut { opacity: .55; }
.trk .th { display: grid; gap: 2px; }
.trk .th small { color: var(--mute); margin-left: 26px; }
.trk .tb { display: flex; flex-wrap: wrap; gap: 6px; }
.trk .tb button, .edtop button, .edrow button { padding: 6px 10px; font-size: 13px; }
.pnl { background: var(--panel2); border-radius: 10px; padding: 8px; display: grid; gap: 8px; }
.two { display: flex; gap: 10px; }
.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.themes .th { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px; border-width: 2px; text-align: left; font-weight: 600; }
.themes .th.on::after { content: " ✓"; }
.sw { display: flex; gap: 4px; } .sw i { width: 22px; height: 12px; border-radius: 4px; display: inline-block; }
.warn { font-size: 12px; color: var(--fill); }
.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.note { font-size: 12px; color: var(--mute); background: var(--panel2); border-radius: 10px; padding: 8px 10px; }
#toast { position: fixed; left: 50%; bottom: 120px; transform: translate(-50%, 20px); background: #000d; color: #fff; padding: 9px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 20; max-width: calc(100vw - 32px); text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 420px) { main { grid-template-columns: 1fr; } header h1 { font-size: 16px; } }
</style>
</head>

<header>
  <h1><span>STY</span> Editor</h1>
  <button id="undo" disabled title="Deshacer el último cambio">↶ Deshacer</button>

  <button id="themeBtn" title="Tema de colores">🎨</button>

  <input id="file" type="file" multiple hidden>

<main id="list"></main>

<div id="bar"><div class="row">
  <div class="play"><button id="bPlay" class="pri">▶ Escuchar</button><span id="pName"></span><label class="chk"><input type="checkbox" id="loop"> Repetir</label></div>
  <div class="cnt"><span id="cnt"></span><a id="clr">Quitar selección</a></div>

</div></div>

<dialog id="dlg"><form method="dialog" class="dlg" id="dlgBody"></form></dialog>

<script type="text/plain" id="engine-src">// ===== Común: acordes, CASM (lo usan el motor de audio y la interfaz) =====
const NN = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const fm = (a, b) => ((a % b) + b) % b;
const CHORDS_L = [
  ["maj", [0, 4, 7]], ["m", [0, 3, 7]], ["7", [0, 4, 7, 10]], ["m7", [0, 3, 7, 10]],
  ["maj7", [0, 4, 7, 11]], ["6", [0, 4, 7, 9]], ["m6", [0, 3, 7, 9]], ["sus4", [0, 5, 7]],
  ["sus2", [0, 2, 7]], ["7sus4", [0, 5, 7, 10]], ["dim", [0, 3, 6]], ["dim7", [0, 3, 6, 9]],
  ["m7b5", [0, 3, 6, 10]], ["aug", [0, 4, 8]], ["add9", [0, 2, 4, 7]], ["9", [0, 4, 7, 10, 2]], ["m9", [0, 3, 7, 10, 2]],
  ["maj9", [0, 4, 7, 11, 2]], ["dim9", [0, 3, 6, 9, 2]], ["11", [0, 4, 7, 10, 2, 5]],
  ["13", [0, 4, 7, 10, 2, 9]], ["7b9", [0, 4, 7, 10, 1]], ["7#9", [0, 4, 7, 10, 3]],
  ["7#5", [0, 4, 8, 10]], ["7b5", [0, 4, 6, 10]], ["mMaj7", [0, 3, 7, 11]],
  ["69", [0, 4, 7, 9, 2]], ["madd9", [0, 3, 7, 2]], ["add11", [0, 4, 7, 5]],
  ["1+5", [0, 7]], ["1+8", [0]]];
const CHORDS = new Map(CHORDS_L);
const YAM_TYPE = { maj: 0, "6": 1, maj7: 2, add9: 4, aug: 7, m: 8, m6: 9, m7: 10, m7b5: 11, dim: 17, dim7: 18, "7": 19, "7sus4": 20, "1+8": 30, "1+5": 31, sus4: 32, sus2: 33 };
const SUP = ["", "¹", "²", "³", "⁴", "⁵", "⁶"];
const SLASH = 100;

function isCustomType(t) { return t.length > 1 && t[0] === "x" && t.substring(1).split("-").every(s => s !== "" && !isNaN(parseInt(s))); }
function isChordType(t) { return CHORDS.has(t) || isCustomType(t); }
function chordIv(t) { return CHORDS.get(t) || (isCustomType(t) ? t.substring(1).split("-").map(s => fm(parseInt(s), 12)) : CHORDS.get("maj")); }
function customType(iv) { return "x" + iv.join("-"); }
function yamType(t) {
  if (t in YAM_TYPE) return YAM_TYPE[t];
  const iv = new Set(chordIv(t));
  if (iv.has(3) && iv.has(6)) return 17;
  if (iv.has(3) && iv.has(10)) return 10;
  if (iv.has(3)) return 8;
  if (iv.has(4) && iv.has(10)) return 19;
  if (iv.has(4) && iv.has(11)) return 2;
  if (iv.has(4) && iv.has(8)) return 7;
  if (iv.has(5) && !iv.has(4)) return 32;
  if (iv.has(2) && !iv.has(4)) return 33;

/** Acorde: {root, type, bass (-1 = sin bajo distinto), inv (0 = fundamental)}. */
function mkChord(root, type, bass = -1, inv = 0) { return { root, type, bass, inv }; }
function chordName(c) {
  return (isCustomType(c.type) ? chordIv(c.type).map(i => NN[(c.root + i) % 12]).join(" ") : NN[c.root] + (c.type === "maj" ? "" : c.type)) +
    (c.inv > 0 ? (SUP[c.inv] || "") : "") + (c.bass >= 0 && c.bass !== c.root ? "/" + NN[c.bass] : "");

/** Código de inversión: 0..n-1 = inversión real; 100 + intervalo = acorde con barra (bajo distinto). */

  const iv = chordIv(type);
  if (code >= SLASH) return mkChord(root, type, fm(root + code - SLASH, 12));
  if (code >= 1 && code < iv.length) return mkChord(root, type, -1, code);
  return mkChord(root, type);

function detectChord(notes) {
  if (!notes.length) return null;
  const low = Math.min(...notes);
  const pcs = new Set(notes.map(n => n % 12));
  if (pcs.size === 1) return mkChord(low % 12, "maj");
  let best = null, score = -1;
  for (const r of pcs) for (const [name, iv] of CHORDS_L) {
    if (name === "1+8") continue;
    const set = new Set(iv.map(i => (r + i) % 12));
    if (set.size !== pcs.size || [...set].some(x => !pcs.has(x))) continue;
    const s = iv.length * 10 + (r === low % 12 ? 5 : 0);
    if (s > score) { score = s; best = mkChord(r, name, r !== low % 12 ? low % 12 : -1); }
  }

  const r = low % 12;
  const rel = new Set([...pcs].map(p => fm(p - r, 12)));

  return mkChord(r, t);
}

const Casm = {
  ROOT_TRANS: 0, ROOT_FIXED: 1, GUITAR: 2, BYPASS: 0, MELODY: 1, CHORD: 2,
  tab(src, noteMute, chordMute, srcRoot, srcType, ntr, ntt, highKey, low, high, rtr, bass) {
    return { src, noteMute, chordMute, srcRoot, srcType, ntr, ntt, highKey, low, high, rtr, bass };
  },
  defaults: null,
  def(ch) {
    if (!this.defaults) this.defaults = Array.from({ length: 16 }, (_, c) =>
      c === 10 ? this.tab(c, 0, 0, 0, 2, 0, 1, 7, 0, 127, 1, true) :
      (c >= 11 && c <= 13) ? this.tab(c, 0, 0, 0, 2, 1, 2, 11, 0, 127, 1, false) :
      (c === 14 || c === 15) ? this.tab(c, 0, 0, 0, 2, 0, 1, 11, 0, 127, 1, false) :
      this.tab(c, 0, 0, 0, 2, 1, 0, 11, 0, 127, 0, false));

  },
  fixed(t) { return t.ntr === 1 && t.ntt === 0; },
  interval(i, type, chord) {
    if (type === "1+8") return i >= 10 ? 12 : 0;
    const iv = chordIv(type);
    const has = x => iv.includes(x);
    const t3 = has(4) ? 4 : has(3) ? 3 : has(5) ? 5 : has(2) ? 2 : -1;
    const t5 = has(7) ? 7 : has(6) ? 6 : has(8) ? 8 : 7;
    const t7 = has(11) ? 11 : has(10) ? 10 : (type === "dim7" || type === "dim9") ? 9 : -1;
    const six = has(9);
    switch (i) {
      case 0: return 0;
      case 1: case 2: return chord ? (has(2) ? 2 : 0) : 2;
      case 3: case 4: return t3 >= 0 ? t3 : 0;
      case 5: return chord ? (t3 >= 0 ? t3 : 0) : 5;
      case 6: case 7: case 8: return t5;

    }
  },
  map(note, t, c, transpose) {
    if (this.fixed(t)) return note;
    const r = fm(c.root + transpose, 12);
    const yt = yamType(c.type);
    if (t.chordMute !== 0 && Math.floor(t.chordMute / Math.pow(2, yt)) % 2 === 0) return -1;
    if (t.noteMute !== 0 && ((t.noteMute >> c.root) & 1) === 0) return -1;
    const chordMode = t.ntt === 2 || t.ntr === 2;
    const rel = fm(note - t.srcRoot, 12);
    let j = (t.ntt === 0 && t.ntr !== 2) ? rel : this.interval(rel, c.type, chordMode);
    if (t.bass && c.bass >= 0 && c.bass !== c.root && rel === 0) j = fm(c.bass - c.root, 12);
    let n;

      let delta = fm(r - t.srcRoot, 12);
      if (r > t.highKey) delta -= 12;
      n = note + delta + (j - rel);
    } else {
      const pc = fm(r + j, 12);
      let d = fm(pc - note, 12);
      if (d > 6) d -= 12;
      n = note + d;
    }
    if (c.inv > 0 && chordMode && !t.bass) {     // inversión real: las notas del acorde que van antes suben una octava
      const ivs = chordIv(c.type).map(x => fm(x, 12));
      if (c.inv < ivs.length) {
        const pcRel = fm(n - r, 12);
        if (ivs.slice(0, c.inv).includes(pcRel) && !ivs.slice(c.inv).includes(pcRel)) n += 12;
      }
    }
    if (t.high - t.low >= 11) {
      if (n > t.high) n -= Math.floor((n - t.high + 11) / 12) * 12;

const GROUPS_CH = { ALL: [...Array(16).keys()], DRUM: [8, 9], ACCOMP: [11, 12, 13, 14, 15], BASS: [10], PIANO: [11], GUITAR: [12], STRINGS: [13], MELODY: [0], OTHER: [14, 15] };

// ===== Motor de audio (AudioWorklet): SoundFont, efectos, CASM y secuenciador con reloj de muestras =====
const SR = sampleRate;
const INV16 = 1 / 32768;
const UNSET = -0x7fffffff;
const GEN_DEF = new Int32Array(61);
GEN_DEF[8] = 13500;
for (const i of [21, 23, 25, 26, 27, 28, 30, 33, 34, 35, 36, 38]) GEN_DEF[i] = -12000;
GEN_DEF[46] = -1; GEN_DEF[47] = -1; GEN_DEF[56] = 100; GEN_DEF[58] = -1;
const NONADD = new Uint8Array(61);
for (const i of [0, 1, 2, 3, 4, 12, 41, 43, 44, 45, 46, 47, 50, 53, 54, 57, 58]) NONADD[i] = 1;
const sc = (index, cc, dir, polar, type) => index | (cc << 7) | (dir << 8) | (polar << 9) | (type << 10);
const mkMod = (src, dest, amount, amtSrc, trans) => ({ src, dest, amount, amtSrc, trans });
const sameMod = (a, b) => a.src === b.src && a.dest === b.dest && a.amtSrc === b.amtSrc && a.trans === b.trans;
const DEFAULT_MODS = [
  mkMod(sc(2, 0, 1, 0, 1), 48, 960, 0, 0), mkMod(sc(2, 0, 1, 0, 0), 8, -2400, 0, 0),
  mkMod(sc(13, 0, 0, 0, 0), 6, 50, 0, 0), mkMod(sc(1, 1, 0, 0, 0), 6, 50, 0, 0),
  mkMod(sc(7, 1, 1, 0, 1), 48, 960, 0, 0), mkMod(sc(10, 1, 0, 1, 0), 17, 1000, 0, 0),
  mkMod(sc(11, 1, 1, 0, 1), 48, 960, 0, 0), mkMod(sc(91, 1, 0, 0, 0), 16, 200, 0, 0),
  mkMod(sc(93, 1, 0, 0, 0), 15, 200, 0, 0)];

class Sf2 {
  constructor(buf) {
    const d = new DataView(buf);
    const tag = p => String.fromCharCode(d.getUint8(p), d.getUint8(p + 1), d.getUint8(p + 2), d.getUint8(p + 3));

    const chunks = {};
    let pos = 12;
    while (pos + 8 <= buf.byteLength) {
      const id = tag(pos), sz = d.getInt32(pos + 4, true);

        const end = Math.min(buf.byteLength, pos + 8 + sz);

          const sid = tag(q), ssz = d.getInt32(q + 4, true);
          if (ssz < 0) break;

        rate: b.getInt32(p + 36, true), pitch: b.getUint8(p + 40), corr: b.getInt8(p + 41), type: u16(p + 44) });

    $("#redo").title = redo.length ? "Rehacer: " + redo[redo.length - 1].label : "Nada que rehacer";
  }

  function card(f) {
    const st = f.st, nm = StyCore.styleName(st);
    const groups = {};
    for (const s of st.sections) (groups[StyCore.kind(s.name)] ||= []).push(s);
    const body = KORD.filter(k => groups[k]).map(k => {
      const list = groups[k].sort((a, b) => StyCore.slotIndex(a.name) - StyCore.slotIndex(b.name));
      return `<div class="grp"><h4><i style="background:${KCOL[k]}"></i>${KNAME[k]}</h4><div class="chips">${list.map(s => {
        const on = sel.some(x => x.id === f.id && x.name === s.name), bars = StyCore.bars(st, s), notes = StyCore.notes(s);
        const label = k === "Break" ? "Break" : (k === "Otra" ? s.name : short(s.name));
        return `<button class="chip${on ? " sel" : ""}${notes ? "" : " empty0"}" style="--k:${KCOL[k]}" data-f="${f.id}" data-s="${esc(s.name)}"><b>${esc(label)}</b><small>${bars} comp.${notes ? "" : " · vacía"}</small></button>`;
      }).join("")}</div></div>`;
    }).join("");
    const bpm = tempoOf(st);
    return `<section class="card${st.dirty ? " dirty" : ""}">
      <div class="ctop"><div class="nm"><b>${esc(st.name)}</b><small>${nm && nm !== st.name ? esc(nm) + " · " : ""}</small>
        <span class="tag">${st.fmt}</span><span class="tag">${st.timeSig[0]}/${st.timeSig[1]}</span>${bpm ? `<span class="tag">${bpm} bpm</span>` : ""}${st.dirty ? `<span class="tag mod">modificado</span>` : ""}</div>
        <button class="x ghost" data-close="${f.id}" title="Cerrar">✕</button></div>
      ${body}
      <div class="cfoot"><button data-all="${f.id}">Seleccionar todo</button><button data-dup="${f.id}">Duplicar</button><button class="pri" data-save="${f.id}">Guardar</button></div>
    </section>`;
  }
  function tempoOf(st) { for (const e of st.setup) if (e.b[0] === 0xFF && e.b[1] === 0x51) { const us = (e.b[3] << 16) | (e.b[4] << 8) | e.b[5]; return us ? Math.round(60000000 / us) : 0; } return 0; }

  $("#list").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.s !== undefined) {
      const id = +b.dataset.f, name = b.dataset.s, i = sel.findIndex(x => x.id === id && x.name === name);
      if (i >= 0) sel.splice(i, 1); else { sel.push({ id, name }); last = { id, name }; if (Player.playing && !Player.busy) Player.play(last); }
      render(); return;
    }
    if (b.dataset.all) { const id = +b.dataset.all, f = fileById(id); const all = f.st.sections.every(s => sel.some(x => x.id === id && x.name === s.name)); sel = sel.filter(x => x.id !== id); if (!all) for (const s of f.st.sections) sel.push({ id, name: s.name }); render(); return; }
    if (b.dataset.close) return closeFile(+b.dataset.close);
    if (b.dataset.dup) { const f = fileById(+b.dataset.dup); const st = StyCore.snapshot(f.st); st.name = f.st.name.replace(/(\.[^.]+)?$/, m => " (copia)" + (m || ".sty")); st.dirty = true; files.splice(files.indexOf(f) + 1, 0, { id: nextId++, st }); render(); toast("Copia creada"); return; }
    if (b.dataset.save) return saveFile(+b.dataset.save);
  };
  $("#clr").onclick = () => { sel = []; render(); };

  // ---------- Diálogos ----------
  function dialog(html, onOk) {
    const d = $("#dlg"), body = $("#dlgBody");
    body.innerHTML = html;
    body.onsubmit = ev => { const v = ev.submitter && ev.submitter.value; if (v === "ok") { const r = onOk(body); if (r === false) { ev.preventDefault(); } } };
    d.showModal();
    return body;
  }

  function closeFile(id) {
    const f = fileById(id);
    const go = () => { files.splice(files.indexOf(f), 1); sel = sel.filter(x => x.id !== id); render(); };
    if (!f.st.dirty) return go();
    dialog(`<h3>¿Cerrar sin guardar?</h3><p>${esc(f.st.name)} tiene cambios que no has guardado.</p>
      <div class="acts"><button value="cancel">Cancelar</button><button value="ok" class="del">Cerrar</button></div>`, go);
  }

  function saveFile(id) {
    const f = fileById(id);
    const body = dialog(`<h3>Guardar estilo</h3>
      <label class="f">Nombre del archivo<input type="text" id="fname" value="${esc(f.st.name)}"></label>
      <p>Se guarda en la carpeta de Descargas de tu teléfono o PC.</p>
      <div class="acts"><button value="cancel">Cancelar</button><button value="ok" class="pri">Guardar</button></div>`, b => {
      let name = b.querySelector("#fname").value.trim() || f.st.name;
      if (!/\.[a-z0-9]{2,4}$/i.test(name)) name += ".sty";
      const bytes = StyCore.build(f.st);
      download(bytes, name);
      f.st.name = name; f.st.dirty = false; render(); toast("Guardado: " + name);
    });
    const inp = body.querySelector("#fname"); inp.focus(); inp.setSelectionRange(0, inp.value.replace(/\.[^.]+$/, "").length);
  }
  function download(bytes, name) {
    if (window.AndroidSaver) { // dentro de la app Android
      let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      window.AndroidSaver.save(name, btoa(s)); return;
    }
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  // Eliminar
  $("#bDel").onclick = () => {
    const by = groupSel();
    const lines = by.map(([id, names]) => `<b>${esc(fileById(id).st.name)}</b>: ${names.map(esc).join(", ")}`).join("<br>");
    dialog(`<h3>Eliminar ${sel.length === 1 ? "sección" : sel.length + " secciones"}</h3><p>${lines}</p>
      <div class="acts"><button value="cancel">Cancelar</button><button value="ok" class="del">Eliminar</button></div>`, () => {
      pushUndo(by.map(x => x[0]), "eliminar");
      for (const [id, names] of by) for (const n of names) StyCore.remove(fileById(id).st, n);
      const n = sel.length; sel = []; render(); toast(n === 1 ? "Sección eliminada" : n + " secciones eliminadas");
    });
  };
  function groupSel() { const m = new Map(); for (const s of sel) { if (!m.has(s.id)) m.set(s.id, []); m.get(s.id).push(s.name); } return [...m.entries()]; }

  // Ranuras posibles del mismo tipo
  function slotsFor(name) { const k = StyCore.kind(name); return k === "Otra" ? [name] : StyCore.SLOTS.filter(s => StyCore.kind(s) === k); }
  const fillOf = main => /^Main [A-D]$/.test(main) ? "Fill In " + main.slice(-1) + main.slice(-1) : null;

  // Copiar / mover
  function transfer(move) {
    const srcIds = [...new Set(sel.map(s => s.id))];
    if (files.length < 2 && !move) { /* copiar dentro del mismo archivo está permitido */ }
    const items = sel.map(s => ({ ...s }));
    const hasMain = items.some(x => fillOf(x.name));
    const defDest = (files.find(f => !srcIds.includes(f.id)) || files[0]).id;
    const checked = new Set([defDest]);
    const tg = {};   // tg[destId][i] = letra elegida
    const body = dialog(`<h3>${move ? "Mover" : "Copiar"} ${items.length === 1 ? "sección" : items.length + " secciones"}</h3>
      <div class="f">A los archivos (puedes marcar varios)</div>
      <div class="dests" id="dests">${files.map(f => `<label class="chk dst"><input type="checkbox" value="${f.id}"${checked.has(f.id) ? " checked" : ""}> <span>${esc(f.st.name)}${srcIds.includes(f.id) ? " <small>(origen)</small>" : ""}</span></label>`).join("")}</div>
      <div class="map" id="map"></div>
      ${hasMain ? `<label class="chk"><input type="checkbox" id="withFill" checked> Llevar también el Fill In de cada Main</label>` : ""}
      <div class="note">La sección se lleva sus notas y su ajuste de acordes (CASM). Sonará con los instrumentos del archivo de destino.</div>
      <div class="warn" id="warn"></div>
      <div class="acts"><button value="cancel">Cancelar</button><button value="ok" class="pri">${move ? "Mover" : "Copiar"}</button></div>`, b => {
      const dsts = [...checked].map(fileById).filter(Boolean);
      if (!dsts.length) { b.querySelector("#warn").textContent = "Marca al menos un archivo de destino."; return false; }
      const withFill = b.querySelector("#withFill") ? b.querySelector("#withFill").checked : false;
      const jobs = [];
      for (const d of dsts) {
        const mine = items.map((it, i) => ({ dst: d, src: fileById(it.id), name: it.name, to: tg[d.id][i] }));
        if (new Set(mine.map(j => j.to)).size !== mine.length) { b.querySelector("#warn").textContent = `En ${d.st.name} dos secciones van al mismo lugar. Cambia una.`; return false; }
        if (withFill) for (const j of [...mine]) {
          const fl = fillOf(j.name), tf = fillOf(j.to);
          if (fl && tf && StyCore.get(j.src.st, fl) && !mine.some(x => x.src === j.src && x.name === fl) && !mine.some(x => x.to === tf)) mine.push({ dst: d, src: j.src, name: fl, to: tf });
        }
        jobs.push(...mine);
      }
      const real = jobs.filter(j => !(j.src === j.dst && j.name === j.to));
      if (!real.length) { toast("No hay nada que cambiar"); return; }
      const touched = [...new Set([...dsts.map(d => d.id), ...(move ? real.map(j => j.src.id) : [])])];
      pushUndo(touched, move ? "mover" : "copiar");
      // Fotos de los originales antes de tocar nada
      const snaps = new Map([...new Set(real.map(j => j.src))].map(f => [f.id, StyCore.snapshot(f.st)]));
      for (const j of real) StyCore.copy(snaps.get(j.src.id), j.name, j.dst.st, j.to);
      if (move) {
        const done = new Set();
        for (const j of real) {
          const k = j.src.id + "|" + j.name; if (done.has(k)) continue; done.add(k);
          if (!jobs.some(x => x.dst === j.src && x.to === j.name)) StyCore.remove(j.src.st, j.name);
        }
      }
      sel = []; render();
      const n = new Set(real.map(j => j.src.id + "|" + j.name)).size;
      toast(`${n === 1 ? "1 sección" : n + " secciones"} ${move ? "movidas" : "copiadas"} a ${dsts.length === 1 ? dsts[0].st.name : dsts.length + " archivos"}`);
    });
    const fillMap = () => {
      const html = [];
      for (const d of files.filter(f => checked.has(f.id))) {
        const used = new Set(), prev = tg[d.id];
        tg[d.id] = items.map((it, i) => {
          const src = fileById(it.id), opts = slotsFor(it.name);
          let def = prev && prev[i] && opts.includes(prev[i]) && !used.has(prev[i]) ? prev[i] : null;
          if (!def) def = [it.name, ...opts].find(o => !used.has(o) && !StyCore.get(d.st, o));
          if (!def) def = !used.has(it.name) ? it.name : (opts.find(o => !used.has(o)) || it.name);
          used.add(def); return def;
        });
        html.push(`<div class="mh">${checked.size > 1 || srcIds.length > 1 ? "→ " + esc(d.st.name) : ""}</div>` + items.map((it, i) => {
          const src = fileById(it.id), opts = slotsFor(it.name);
          const srcLabel = (srcIds.length > 1 ? esc(src.st.name.replace(/\.[^.]+$/, "")) + " · " : "") + esc(it.name);
          return `<div class="r"><span>${srcLabel}</span><em>→</em><select data-d="${d.id}" data-i="${i}">${opts.map(o => `<option value="${esc(o)}"${o === tg[d.id][i] ? " selected" : ""}>${esc(o === "Fill In BA" ? "Break (Fill In BA)" : o)}${StyCore.get(d.st, o) ? " · reemplaza" : ""}</option>`).join("")}</select></div>`;
        }).join(""));
      }
      body.querySelector("#map").innerHTML = html.join("");
      checkWarn();
    };
    const checkWarn = () => {
      const ws = [];
      for (const d of files.filter(f => checked.has(f.id))) {
        const rep = (tg[d.id] || []).filter(t => StyCore.get(d.st, t));
        if (rep.length) ws.push(`En ${d.st.name} se reemplazará: ${[...new Set(rep)].join(", ")}.`);
        if (items.some(it => fileById(it.id).st.timeSig.join("/") !== d.st.timeSig.join("/"))) ws.push(`Ojo: el compás de ${d.st.name} no es el mismo que el de origen.`);
      }
      body.querySelector("#warn").textContent = ws.join(" ");
    };
    body.querySelector("#dests").onchange = e => { const id = +e.target.value; if (e.target.checked) checked.add(id); else checked.delete(id); fillMap(); };
    body.querySelector("#map").onchange = e => { const s = e.target; tg[+s.dataset.d][+s.dataset.i] = s.value; checkWarn(); };
    fillMap();
  }
  $("#bCopy").onclick = () => transfer(false);
  $("#bMove").onclick = () => transfer(true);

  // Cambiar letra (dentro del mismo archivo, intercambia si está ocupada)
  $("#bRen").onclick = () => {
    const it = sel[0], f = fileById(it.id), opts = slotsFor(it.name).filter(o => o !== it.name);
    if (!opts.length) { toast("Esta sección no tiene otra letra posible"); return; }
    dialog(`<h3>Cambiar letra de ${esc(it.name)}</h3>
      <label class="f">Nueva posición<select id="to">${opts.map(o => `<option value="${esc(o)}">${esc(o === "Fill In BA" ? "Break" : o)}${StyCore.get(f.st, o) ? " · se intercambian" : ""}</option>`).join("")}</select></label>
      <p>Si la nueva posición ya está ocupada, las dos secciones se intercambian.</p>
      <div class="acts"><button value="cancel">Cancelar</button><button value="ok" class="pri">Cambiar</button></div>`, b => {
      const to = b.querySelector("#to").value;
      pushUndo([f.id], "cambiar letra");
      StyCore.rename(f.st, it.name, to);
      sel = []; render(); toast(`${it.name} ahora es ${to}`);
    });
  };

  // Deshacer / rehacer
  function swap(from, to, verb) {
    const u = from.pop(); if (!u) return;
    to.push({ label: u.label, items: u.items.map(it => { const f = fileById(it.id); return f ? { id: it.id, st: StyCore.snapshot(f.st) } : null; }).filter(Boolean) });
    for (const it of u.items) { const f = fileById(it.id); if (f) f.st = it.st; }
    sel = []; render(); toast(verb + ": " + u.label);
  }
  $("#undo").onclick = () => swap(undo, redo, "Deshecho");
  $("#redo").onclick = () => swap(redo, undo, "Rehecho");

  // ---------- Temas de color (los mismos 10 de StyPlayer) ----------
  const H = n => "#" + n.toString(16).padStart(6, "0");
  const THEMES = [
    ["Noche (original)", 0, 0x0E1015, 0x181C24, 0x262C38, 0xECEFF4, 0x8A93A6, 0xFBBF24],
    ["Océano", 0, 0x06141F, 0x0D2232, 0x16364A, 0xE6F6FF, 0x7FA6BD, 0x22D3EE],
    ["Bosque", 0, 0x0B130D, 0x142118, 0x1F3325, 0xE8F5EA, 0x8FAE96, 0x4ADE80],
    ["Atardecer", 0, 0x170C10, 0x24131A, 0x3A1D28, 0xFFEDF2, 0xB78C99, 0xFB7185],
    ["Púrpura", 0, 0x110C1C, 0x1B1430, 0x2B2148, 0xF1ECFF, 0x9C93BD, 0xA78BFA],
    ["Rojo escenario", 0, 0x120707, 0x1F0D0D, 0x331616, 0xFFECEC, 0xB48A8A, 0xEF4444],
    ["Grafito", 0, 0x111111, 0x1B1B1B, 0x2A2A2A, 0xF2F2F2, 0x9A9A9A, 0xE5E5E5],
    ["Retro LCD", 0, 0x12140C, 0x1D2114, 0x2C3220, 0xEEF2DC, 0x9CA38A, 0xC3E067],
    ["Claro", 1, 0xEEF1F6, 0xFFFFFF, 0xDDE3EC, 0x1A1F2B, 0x5D6778, 0x2563EB],
    ["Arena", 1, 0xF5EFE4, 0xFFFBF3, 0xE8DCC6, 0x2E2418, 0x7A6A55, 0xB45309]
  ];
  function applyTheme(i) {
    const t = THEMES[i] || THEMES[0], r = document.documentElement.style;
    r.setProperty("--bg", H(t[2])); r.setProperty("--panel", H(t[3])); r.setProperty("--panel2", H(t[4])); r.setProperty("--text", H(t[5]));
    r.setProperty("--mute", H(t[6])); r.setProperty("--accent", H(t[7])); r.setProperty("--line", `color-mix(in srgb, ${H(t[5])} 16%, ${H(t[3])})`);
    r.setProperty("--onacc", t[1] ? "#fff" : "#111"); r.setProperty("--danger", t[1] ? "#d92d2d" : "#ff5b5b");
    r.colorScheme = t[1] ? "light" : "dark";
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = H(t[2]);
    try { localStorage.setItem("styed.theme", i); } catch (e) { }
  }
  let themeI = 0; try { themeI = Math.max(0, Math.min(THEMES.length - 1, +localStorage.getItem("styed.theme") || 0)); } catch (e) { }
  applyTheme(themeI);
  $("#themeBtn").onclick = () => {
    const d = $("#dlg"), body = $("#dlgBody"); body.onsubmit = null; body.onclick = null; body.onchange = null;
    body.innerHTML = `<h3>Tema de colores</h3><div class="themes">${THEMES.map((t, i) => `<button type="button" class="th${i === themeI ? " on" : ""}" data-t="${i}" style="background:${H(t[2])};color:${H(t[5])};border-color:${i === themeI ? H(t[7]) : H(t[4])}"><span class="sw"><i style="background:${H(t[3])}"></i><i style="background:${H(t[4])}"></i><i style="background:${H(t[7])}"></i></span>${esc(t[0])}</button>`).join("")}</div>
      <div class="acts"><button type="button" class="pri" data-x="1">Listo</button></div>`;
    body.onclick = e => { const b = e.target.closest("button"); if (!b) return; if (b.dataset.x) { d.close(); return; } themeI = +b.dataset.t; applyTheme(themeI); body.querySelectorAll(".th").forEach(x => { const on = +x.dataset.t === themeI; x.classList.toggle("on", on); x.style.borderColor = on ? H(THEMES[+x.dataset.t][7]) : H(THEMES[+x.dataset.t][4]); }); };

  // ---------- Editar sección (detalle) ----------
  const NOTE_N = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const ed = { id: 0, name: "", muted: new Set(), panel: null };   // panel: {k:"copy"|"casm", ch}
  const opt = (arr, v, extra) => arr.map((t, i) => `<option value="${i}"${i === v ? " selected" : ""}>${esc(t)}</option>`).join("") + (v >= arr.length ? `<option value="${v}" selected>${extra || "Otro"} (${v})</option>` : "");
  function edCur() { const f = fileById(ed.id); return f ? { f, st: f.st, sec: StyCore.get(f.st, ed.name) } : null; }
  function edHtml() {
    const c = edCur(); if (!c || !c.sec) return `<h3>La sección ya no existe</h3><div class="acts"><button type="button" data-ed="close">Cerrar</button></div>`;
    const { st, sec } = c, tracks = StyCore.trackStats(sec);
    const bars = StyCore.bars(st, sec);
    const rows = tracks.map(t => `<div class="trk${ed.muted.has(t.ch) ? " mut" : ""}">
        <div class="th"><label class="chk"><input type="checkbox" data-ed="mute" data-ch="${t.ch}"${ed.muted.has(t.ch) ? "" : " checked"}> <b>${StyCore.CH_NAMES[t.ch]}</b></label>
          <small>${t.notes} notas · fuerza ${t.vel} · ${NOTE_N[t.min % 12]}${Math.floor(t.min / 12) - 1}–${NOTE_N[t.max % 12]}${Math.floor(t.max / 12) - 1}</small></div>
        <div class="tb">
          <button type="button" data-ed="vel" data-ch="${t.ch}" data-v="88">Fuerza −</button><button type="button" data-ed="vel" data-ch="${t.ch}" data-v="114">Fuerza +</button>

          <button type="button" data-ed="panel" data-k="casm" data-ch="${t.ch}"${StyCore.casmGet(st, sec.name, t.ch) ? "" : " disabled"}>Acordes (CASM)</button>

        ${ed.panel && ed.panel.ch === t.ch ? edPanel(c, t) : ""}
      </div>`).join("");
    return `<h3>Editar ${esc(sec.name)} <small style="color:var(--mute);font-weight:400">· ${esc(st.name)}</small></h3>
      <div class="edtop"><button type="button" class="pri" data-ed="play">${Player.playing ? "■ Parar" : "▶ Escuchar"}</button>
        <label class="chk"><input type="checkbox" data-ed="loop"${$("#loop").checked ? " checked" : ""}> Repetir</label>
        <button type="button" data-ed="undo"${undo.length ? "" : " disabled"}>↶ Deshacer</button><button type="button" data-ed="redo"${redo.length ? "" : " disabled"}>↷ Rehacer</button></div>
      <div class="edbox"><b>Duración</b> <span class="mute">ahora: ${bars} compases</span>
        <div class="edrow"><input type="number" id="edBars" min="1" max="64" step="1" value="${Math.max(1, Math.round(bars))}">
        <button type="button" data-ed="trim">Poner en ese largo</button><button type="button" data-ed="rep">Repetir hasta ese largo</button></div>
        <small class="mute">"Poner en ese largo" recorta, o deja silencio al final si lo alargas. "Repetir" llena el largo repitiendo la sección.</small></div>
      <div class="edbox"><b>Pistas</b> <span class="mute">la casilla solo silencia al escuchar; "Quitar pista" sí borra las notas</span>${rows || "<p>Esta sección no tiene notas.</p>"}</div>
      <div class="acts"><button type="button" class="pri" data-ed="close">Listo</button></div>`;
  }
  function edPanel(c, t) {
    const { st, sec } = c;
    if (ed.panel.k === "copy") {
      const all = []; for (const f of files) for (const s of f.st.sections) all.push({ v: f.id + "|" + s.name, t: `${f.st.name} · ${s.name}` });
      return `<div class="pnl"><div class="mute">Copiar la pista ${StyCore.CH_NAMES[t.ch]} de ${esc(sec.name)} a:</div>
        <select id="cpDst">${all.map(o => `<option value="${esc(o.v)}">${esc(o.t)}</option>`).join("")}</select>
        <select id="cpCh">${StyCore.CH_NAMES.map((n, i) => `<option value="${i}"${i === t.ch ? " selected" : ""}>en ${n}</option>`).join("")}</select>
        <div class="mute">Reemplaza esa pista en la otra sección. Se lleva su CASM y se repite o recorta para que quepa en el largo de destino.</div>
        <button type="button" class="pri" data-ed="docopy" data-ch="${t.ch}">Copiar pista</button></div>`;
    }
    const g = StyCore.casmGet(st, sec.name, t.ch); if (!g) return "";
    return `<div class="pnl casm"><div class="mute">Cómo se adapta ${StyCore.CH_NAMES[t.ch]} cuando cambias de acorde${g.two ? " (se edita la zona media)" : ""}</div>
      <label class="f">Nota del acorde de origen<select data-cs="srcRoot">${opt(NOTE_N, g.srcRoot)}</select></label>
      <label class="f">Tipo de acorde de origen<select data-cs="srcType">${opt(StyCore.CHORD_TYPES, g.srcType)}</select></label>
      <label class="f">Transposición<select data-cs="ntr">${opt(StyCore.NTR, g.ntr)}</select></label>
      <label class="f">Tipo de nota<select data-cs="ntt">${opt(StyCore.NTT, g.ntt)}</select></label>
      <label class="f">Nota más alta (sube/baja)<select data-cs="highKey">${opt(NOTE_N, g.highKey)}</select></label>
      <label class="f">Al cambiar de acorde<select data-cs="rtr">${opt(StyCore.RTR, g.rtr)}</select></label>
      <div class="two"><label class="f">Nota mínima<input type="number" min="0" max="127" data-cs="low" value="${g.low}"></label><label class="f">Nota máxima<input type="number" min="0" max="127" data-cs="high" value="${g.high}"></label></div></div>`;
  }
  function edRender() { $("#dlgBody").innerHTML = edHtml(); }
  function edChange(label, fn) {
    const c = edCur(); if (!c) return;
    pushUndo([c.f.id], label); fn(c); render(); edRender();
    if (Player.playing) Player.play({ id: ed.id, name: ed.name }, ed.muted);
  }
  function openEditor(it) {
    ed.id = it.id; ed.name = it.name; ed.muted = new Set(); ed.panel = null;
    const d = $("#dlg"), body = $("#dlgBody");
    body.onsubmit = null; body.classList.add("wide");
    d.addEventListener("close", () => { body.classList.remove("wide"); body.onclick = null; body.onchange = null; if (Player.playing) Player.stop(); }, { once: true });
    edRender();
    body.onclick = e => {
      const b = e.target.closest("[data-ed]"); if (!b || b.tagName === "INPUT") return;
      const a = b.dataset.ed, ch = +b.dataset.ch, name = ed.name;
      if (a === "close") { d.close(); return; }
      if (a === "play") { if (Player.playing) Player.stop(); else Player.play({ id: ed.id, name }, ed.muted); edRender(); return; }
      if (a === "undo") { swap(undo, redo, "Deshecho"); edRender(); return; }
      if (a === "redo") { swap(redo, undo, "Rehecho"); edRender(); return; }
      if (a === "trim" || a === "rep") { const n = Math.max(1, Math.min(64, +$("#edBars").value || 1)); edChange("cambiar duración", c => StyCore.setBars(c.st, name, n, a === "rep" ? "repeat" : "trim")); return; }
      if (a === "vel") return edChange("fuerza de pista", c => StyCore.trackVel(c.st, name, ch, +b.dataset.v));
      if (a === "oct") return edChange("octava de pista", c => StyCore.trackOct(c.st, name, ch, +b.dataset.v));
      if (a === "del") return edChange("quitar pista", c => StyCore.trackRemove(c.st, name, ch));
      if (a === "panel") { ed.panel = ed.panel && ed.panel.k === b.dataset.k && ed.panel.ch === ch ? null : { k: b.dataset.k, ch }; edRender(); return; }
      if (a === "docopy") {
        const [fid, sn] = $("#cpDst").value.split("|"), dch = +$("#cpCh").value, dst = fileById(+fid);
        pushUndo([dst.id], "copiar pista");
        try { StyCore.copyTrack(edCur().st, name, ch, dst.st, sn, dch); } catch (err) { toast(err.message); return; }
        ed.panel = null; render(); edRender(); toast(`Pista copiada a ${sn} de ${dst.st.name}`); return;
      }
    };
    body.onchange = e => {
      const t = e.target;
      if (t.dataset.ed === "mute") { const ch = +t.dataset.ch; if (t.checked) ed.muted.delete(ch); else ed.muted.add(ch); edRender(); if (Player.playing) Player.play({ id: ed.id, name: ed.name }, ed.muted); }
      else if (t.dataset.ed === "loop") { $("#loop").checked = t.checked; $("#loop").onchange(); }
      else if (t.dataset.cs) { const k = t.dataset.cs, v = Math.max(0, Math.min(127, +t.value | 0)); const ch = ed.panel && ed.panel.ch; edChange("CASM de pista", c => StyCore.casmSet(c.st, ed.name, ch, { [k]: v })); }
    };
    d.showModal();
  }
  $("#bEdit").onclick = () => { if (sel.length === 1) openEditor(sel[0]); };

  // ---------- Escuchar (siempre en C) ----------
  const Player = {
    ctx: null, node: null, sf2: false, playing: false, busy: false,
    async init() {
      if (this.node) return true;
      this.ctx = new AudioContext({ sampleRate: 44100, latencyHint: "playback" });
      const src = document.getElementById("engine-src").textContent;
      try { await this.ctx.audioWorklet.addModule("data:application/javascript;charset=utf-8," + encodeURIComponent(src)); }
      catch (e) { await this.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([src], { type: "application/javascript" }))); }
      this.node = new AudioWorkletNode(this.ctx, "sty-engine", { numberOfInputs: 0, outputChannelCount: [2] });
      this.node.connect(this.ctx.destination);
      this.node.port.onmessage = e => this.onMsg(e.data);
      return true;
    },
    onMsg(m) {
      if (m.t === "sf2ok") { this.sf2 = true; if (this.sf2wait) { this.sf2wait(true); this.sf2wait = null; } }
      else if (m.t === "sf2err") { toast("SoundFont no válido: " + m.msg); if (this.sf2wait) { this.sf2wait(false); this.sf2wait = null; } }
      else if (m.t === "st") { if (this.playing && !m.running && !this.busy && performance.now() - this.t0 > 400) { this.playing = false; paintPlay(); } }
    },
    sendSf2(buf) { return new Promise(r => { this.sf2wait = r; this.node.port.postMessage({ t: "sf2", buf }, [buf]); }); },
    async loadSf2() {
      if (this.sf2) return true;
      const el = document.getElementById("sf2-b64"), txt = el ? el.textContent.trim() : "";
      if (txt.length > 100) { toast("Cargando sonidos…"); const buf = await (await fetch("data:application/octet-stream;base64," + txt)).arrayBuffer(); return this.sendSf2(buf); }
      if (window.AndroidSaver) { try { const r = await fetch("https://appassets.local/GeneralUser-GS.sf2"); if (r.ok) { toast("Cargando sonidos…"); return this.sendSf2(await r.arrayBuffer()); } } catch (e) { } }
      const saved = await Store.get("soundfont.sf2");
      if (saved) return this.sendSf2(saved.slice(0));
      return pickSf2();
    },
    async play(it, muted) {
      if (this.busy) return;
      this.busy = true;
      try {
        await this.init();
        if (this.ctx.state !== "running") await this.ctx.resume();
        if (!(await this.loadSf2())) { this.busy = false; return; }
        const f = fileById(it.id), sec = f && StyCore.get(f.st, it.name);
        if (!sec) { this.busy = false; return; }
        const loop = $("#loop").checked, as = loop ? "Main A" : "Ending A";
        // Estilo temporal con solo esa sección (con su CASM): bucle = como Main, una vez = como Ending
        const evs = muted && muted.size ? sec.events.filter(e => !(e.b[0] >= 0x80 && e.b[0] < 0xA0 && muted.has(e.b[0] & 15))) : sec.events;
        const tmp = { ...f.st, sections: [{ name: as, len: sec.len, events: evs }], casm: [] };
        const subs = StyCore.casmOf(f.st, it.name);
        if (subs) tmp.casm = [{ names: [as], subs }];
        const style = StyParser.parse(StyCore.build(tmp));
        const msgs = [{ t: "stop" }, { t: "style", style }, { t: "set", v: { transpose: 0, auto: false } }, { t: "chord", c: mkChord(0, "maj") }, { t: "start", name: as }];
        for (const m of msgs) this.node.port.postMessage(m);
        this.playing = true; this.t0 = performance.now(); this.now = it;
      } catch (e) { toast("No se pudo reproducir: " + (e.message || e)); this.playing = false; }
      this.busy = false; paintPlay();
    },
    stop() { if (this.node) this.node.port.postMessage({ t: "stop" }); this.playing = false; paintPlay(); }
  };
  function paintPlay() {
    $("#bar .play").classList.toggle("on", Player.playing);
    $("#bPlay").textContent = Player.playing ? "■ Parar" : "▶ Escuchar";
  }
  $("#bPlay").onclick = () => { if (Player.playing) Player.stop(); else if (last) Player.play(last); };
  try { $("#loop").checked = localStorage.getItem("styed.loop") === "1"; } catch (e) { }
  $("#loop").onchange = () => { try { localStorage.setItem("styed.loop", $("#loop").checked ? "1" : "0"); } catch (e) { } if (Player.playing && last) Player.play(last); };
  function pickSf2() {
    return new Promise(res => {
      dialog(`<h3>Falta el SoundFont</h3><p>Esta versión ligera no trae sonidos. Elige un archivo .sf2 (por ejemplo GeneralUser GS). Se guarda en el navegador y no lo vuelve a pedir.</p>
        <div class="acts"><button value="cancel">Cancelar</button><button value="ok" class="pri">Elegir .sf2</button></div>`, () => {
        const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".sf2";
        inp.onchange = async () => { const f = inp.files[0]; if (!f) return res(false); toast("Cargando sonidos…"); const buf = await f.arrayBuffer(); try { await Store.set("soundfont.sf2", buf.slice(0)); } catch (e) { } res(await Player.sendSf2(buf)); };
        inp.click();
      });
      $("#dlg").addEventListener("close", () => { if ($("#dlg").returnValue !== "ok") res(false); }, { once: true });
    });
  }
  const Store = {
    db() { return new Promise((ok, ko) => { const r = indexedDB.open("sty-editor", 1); r.onupgradeneeded = () => r.result.createObjectStore("f"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); },
    async get(k) { try { const db = await this.db(); return await new Promise(ok => { const q = db.transaction("f").objectStore("f").get(k); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; } },
    async set(k, v) { const db = await this.db(); return new Promise(ok => { const t = db.transaction("f", "readwrite"); t.objectStore("f").put(v, k); t.oncomplete = ok; t.onerror = ok; }); }
  };

  addEventListener("beforeunload", e => { if (files.some(f => f.st.dirty)) { e.preventDefault(); e.returnValue = ""; } });
  window.StyEditor = { openBytes(name, b64) { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); try { files.push({ id: nextId++, st: StyCore.parse(u, name) }); } catch (e) { toast(`No pude abrir ${name}: ${e.message}`); } render(); }, toast };
  render();
})();
</script>
</body>
</html>
